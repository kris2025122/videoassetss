<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stable GS Viewer</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';
  import { OrbitControls } from 'https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js';
  import { KTXSplatLoader } from 'https://cdn.jsdelivr.net/gh/mkkellogg/GaussianSplats3D@main/jsm/KTXSplatLoader.js';
  import { SplatLoader } from 'https://cdn.jsdelivr.net/gh/mkkellogg/GaussianSplats3D@main/jsm/SplatLoader.js';

  const q = new URLSearchParams(location.search);
  const SRC = q.get('src') || 'TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(0, 0, 3);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.update();

  const group = new THREE.Group();
  scene.add(group);

  async function loadSplat(src) {
    let obj;
    const lower = src.toLowerCase();
    if (lower.endsWith('.ksplat') || lower.endsWith('.ktx2')) {
      const loader = new KTXSplatLoader();
      obj = await loader.loadAsync(src);
    } else if (lower.endsWith('.splat')) {
      const loader = new SplatLoader();
      obj = await loader.loadAsync(src);
    } else {
      alert("Usa un archivo .ksplat o .splat");
      return;
    }

    group.clear();
    group.add(obj);

    // Rotación 180° para mantenerlo “al revés”, como la versión que viste
    obj.rotation.x = Math.PI;

    // Centrado y encuadre
    const box = new THREE.Box3().setFromObject(obj);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    obj.position.sub(sphere.center);
    const dist = Math.max(2.5, sphere.radius * 2.4);
    camera.position.set(0, 0, dist);
    controls.target.set(0, 0, 0);
    controls.update();
  }

  loadSplat(SRC);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
