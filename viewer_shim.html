<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GS Viewer (Quest 3 • VR)</title>
  <meta http-equiv="origin-trial" content="">
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    import { VRButton } from 'https://unpkg.com/three@0.161.0/examples/jsm/webxr/VRButton.js';

    import { KTXSplatLoader } from 'https://cdn.jsdelivr.net/gh/mkkellogg/GaussianSplats3D@main/jsm/KTXSplatLoader.js';
    import { SplatLoader } from 'https://cdn.jsdelivr.net/gh/mkkellogg/GaussianSplats3D@main/jsm/SplatLoader.js';

    const urlParams = new URLSearchParams(location.search);
    const SRC = urlParams.get('src') || 'HARAKBUTvrhm.ksplat';

    // Renderer con XR activado
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.xr.enabled = true;  // <= clave para que aparezca VRButton
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Botón VR
    document.body.appendChild(VRButton.createButton(renderer));

    // Escena y cámara
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 3);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    const group = new THREE.Group();
    scene.add(group);

    async function loadSplat(src) {
      let obj;
      if (src.endsWith('.ksplat')) {
        const loader = new KTXSplatLoader();
        obj = await loader.loadAsync(src);
      } else if (src.endsWith('.splat')) {
        const loader = new SplatLoader();
        obj = await loader.loadAsync(src);
      }
      obj.rotation.x = Math.PI;  // mantener invertido
      group.add(obj);

      // centrado automático
      const box = new THREE.Box3().setFromObject(obj);
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      obj.position.sub(sphere.center);
      camera.position.set(0, 0, sphere.radius * 2.5);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    loadSplat(SRC);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
