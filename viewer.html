<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (Quest/Browser)</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    canvas{display:block;width:100%;height:100%}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
    #tips{
      position:fixed;right:8px;bottom:8px;color:#fff;
      background:rgba(0,0,0,.35);padding:6px 8px;font:12px/1.4 system-ui;border-radius:6px
    }
    a{color:#aef}
  </style>
</head>
<body>
<div id="log">Inicializando…</div>
<div id="tips">Tip: en Quest 3 pulsa “Enter VR”. En desktop, usa el mouse/teclas para moverte.</div>

<script type="module">
/* ===== Utilidades de log ===== */
const $log = document.getElementById('log');
const log  = (m)=>{ $log.textContent += '\n'+m; console.log(m); };

/* ===== Parámetros ===== */
const params = new URLSearchParams(location.search);
const DEFAULT_NAME = 'TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat'; // <- tu archivo por defecto
let src = params.get('src') || DEFAULT_NAME;

/* Si el usuario pasó solo un nombre, resolvemos primero en raíz y luego en /assets/ */
async function resolveSrc(urlOrName){
  // Si parece URL absoluta, úsala tal cual
  if (/^https?:\/\//i.test(urlOrName)) return urlOrName;

  // 1) probar en raíz
  let resp = await fetch(urlOrName, { method:'HEAD' });
  if (resp.ok) return urlOrName;

  // 2) probar en /assets/
  resp = await fetch('assets/'+urlOrName, { method:'HEAD' });
  if (resp.ok) return 'assets/'+urlOrName;

  // 3) si no existe, devolvemos el original (fallará más abajo con error legible)
  return urlOrName;
}

/* ===== Arranque ===== */
(async()=>{
  try{
    log('Cargando librerías…');
    const THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
    const { VRButton } = await import('https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js');
    const { GaussianSplatThreeJS } = await import('https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d/dist/gaussian-splats-3d.module.js');

    // Resolver ruta final
    src = await resolveSrc(src);
    log('Fuente: '+src);
    const head = await fetch(src, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if (!head.ok) throw new Error('No se puede acceder al archivo KSPLAT en: '+src);

    // Escena básica
    const scene   = new THREE.Scene();
    const camera  = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 4000);
    camera.position.set(0,0,3);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // estabilidad en Quest
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // Resize
    addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Controles simples (flechas/WASD + rueda para acercar)
    let az=0, el=0, dist=3;
    const key = {};
    addEventListener('keydown', e=> key[e.code]=true);
    addEventListener('keyup',   e=> key[e.code]=false);
    addEventListener('wheel', e=>{
      dist = Math.max(0.5, Math.min(25, dist + (e.deltaY>0? 0.3 : -0.3)));
    }, {passive:true});

    function updateCamera(dt){
      const spd = 1.5 * dt;
      if (key['ArrowLeft']||key['KeyA']) az -= spd;
      if (key['ArrowRight']||key['KeyD']) az += spd;
      if (key['ArrowUp']||key['KeyW']) el = Math.min(Math.PI/2-0.01, el + spd);
      if (key['ArrowDown']||key['KeyS']) el = Math.max(-Math.PI/2+0.01, el - spd);
      const x = dist * Math.cos(el) * Math.sin(az);
      const y = dist * Math.sin(el);
      const z = dist * Math.cos(el) * Math.cos(az);
      camera.position.set(x,y,z);
      camera.lookAt(0,0,0);
    }

    // Cargar KSPLAT con progreso
    log('Cargando KSPLAT…');
    const loader = new GaussianSplatThreeJS.SplatLoader();
    const t0 = performance.now();
    const splat = await loader.load(src, (p)=>{
      if (p && p.total) {
        const pct = Math.round(100 * p.loaded / p.total);
        if (pct%5===0) log(`Progreso: ${pct}%`);
      }
    });
    log(`Cargado en ${Math.round(performance.now()-t0)} ms`);

    // Render
    splat.frustumCulled = false;
    scene.add(splat);

    let last = performance.now();
    renderer.setAnimationLoop(()=>{
      const now = performance.now();
      const dt  = (now - last) / 1000;
      last = now;
      updateCamera(dt);
      renderer.render(scene, camera);
    });

    log('Listo. Si no ves nada, acércate con la rueda del mouse o entra a VR.');
  }catch(err){
    console.error(err);
    log('ERROR: '+(err?.message||err));
    log('Asegúrate de que el archivo existe y la ruta en ?src= es correcta.');
  }
})();
</script>
</body>
</html>
