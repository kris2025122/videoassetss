<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>

  <!-- Import map: que "three" apunte a tu copia local -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js"
    }
  }
  </script>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu KSPLAT en la RAÍZ del repo:
const FILE = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

// Muestra errores en pantalla
addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log("Cargando módulos locales…");
    // Aseguramos 'three' local y el módulo ESM local del viewer
    await import("./lib/three.module.js");
    const GS = (await import("./lib/gaussian-splats-3d.module.js")).default
               ?? (await import("./lib/gaussian-splats-3d.module.js"));

    // Verifica que el KSPLAT exista (200 OK)
    const head = await fetch(FILE, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE);

    // === Viewer integrado (sin SharedArrayBuffer, sin WebXR para desktop) ===
    const viewer = new GS.Viewer({
      webXRMode: GS.WebXRMode?.None ?? 0,
      sharedMemoryForWorkers: false,  // GitHub Pages no tiene COOP/COEP
      gpuAcceleratedSort: false,      // recomendado cuando lo anterior es false
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,
      antialiased: true,
      logLevel: GS.LogLevel?.Info ?? 1
    });

    await viewer.addSplatScene(FILE, {
      showLoadingUI: true
      // splatAlphaRemovalThreshold = 1 por defecto (no tocamos)
    });

    viewer.start();
    log("Listo: debería verse ya en Chrome. Abre esta misma URL en Quest 3 para VR.");

  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
