<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{display:block;width:100vw;height:100vh}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu KSPLAT en la RAÍZ del repo:
const FILE = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

// Errores visibles
addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log("Cargando módulos…");
    // Importa TODO vía esm.sh (evita problemas de 'three' y submódulos)
    const THREE = await import("https://esm.sh/three@0.160.0");
    const { OrbitControls } = await import("https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js?deps=three@0.160.0");
    const GS = await import("https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4.7?deps=three@0.160.0");

    // Verifica que el archivo existe
    const head = await fetch(FILE, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE);

    // Escena básica
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controles de órbita
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Carga del KSPLAT
    log("Cargando KSPLAT…");
    const loader = new GS.GaussianSplatThreeJS.SplatLoader();
    const t0 = performance.now();
    const splat = await loader.load(FILE, (p)=>{
      if(p && p.total){
        const pct = Math.round(100*p.loaded/p.total);
        if (pct % 10 === 0) log(`Progreso: ${pct}%`);
      }
    });
    log(`Cargado en ${Math.round(performance.now()-t0)} ms`);

    // Ajustes y encuadre automático
    splat.frustumCulled = false;
    scene.add(splat);

    // Calcula bounding box y centra cámara/controles
    const box = new THREE.Box3().setFromObject(splat);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = size.length() * 0.5;
    const dist = radius * 1.5;

    camera.near = Math.max(0.01, radius/1000);
    camera.far  = Math.max(2000, radius*10);
    camera.updateProjectionMatrix();

    camera.position.copy(center.clone().add(new THREE.Vector3(0, 0, dist)));
    controls.target.copy(center);
    controls.update();

    // Resize
    addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Render loop
    function tick(){
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();

    log("Listo. Si no ves nada, usa la rueda para acercarte o arrastra para orbitar.");
  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
