<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu archivo en la RAÍZ del repo (ya confirmaste que descarga):
const FILE_PATH = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

(async()=>{
  try{
    log("Cargando librería…");
    // Importa el módulo desde jsDelivr usando la ruta correcta /build/
    const GaussianSplats3D = await import(
      "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    );

    // Verifica que el archivo exista en Pages
    const head = await fetch(FILE_PATH, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE_PATH);

    // Crea el viewer integrado (sin WebXR y sin SharedArrayBuffer para GitHub Pages)
    const viewer = new GaussianSplats3D.Viewer({
      webXRMode: GaussianSplats3D.WebXRMode.None,
      sharedMemoryForWorkers: false,  // evita requerir COOP/COEP en Pages
      gpuAcceleratedSort: true,       // puedes poner false si el PC es muy justo
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,   // más estable en portátiles/Quest
      antialiased: true
    });

    // Añade tu escena KSPLAT y arranca
    await viewer.addSplatScene(FILE_PATH, {
      showLoadingUI: true,
      splatAlphaRemovalThreshold: 1    // respeta casi todo (ya comprimiste con alpha alto)
    });

    viewer.start();
    log("Listo. Deberías ver el KSPLAT en Chrome. (En Quest: abre esta misma URL y pulsa Enter VR en el UI del viewer).");
  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
