<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=(m)=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu KSPLAT en la RAÍZ del repo (ya comprobaste que descarga):
const FILE_PATH = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

// Mostrar cualquier error global en el log
window.addEventListener('error', e=> log('ERROR(win): '+e.message));
window.addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log("Cargando librería…");
    // Import desde CDN (ruta correcta: /build/)
    const GS = await import("https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js");

    // Verifica que el archivo exista en Pages (debe dar 200)
    const head = await fetch(FILE_PATH, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE_PATH);

    // Viewer integrado SIN WebXR ni SharedArrayBuffer (compatible con GitHub Pages)
    const viewer = new GS.Viewer({
      webXRMode: GS.WebXRMode.None,
      sharedMemoryForWorkers: false, // COOP/COEP no requerido en Pages
      gpuAcceleratedSort: false,     // RECOMENDADO cuando sharedMemoryForWorkers=false
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,
      antialiased: true,
      logLevel: GS.LogLevel.Info
    });

    // Carga del KSPLAT (no toco splatAlphaRemovalThreshold: por defecto 1/255)
    await viewer.addSplatScene(FILE_PATH, {
      showLoadingUI: true
    });

    // Arranca el render
    viewer.start();
    log("Listo: debería verse en Chrome. En Quest 3 también funciona esta misma URL.");
  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
