<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{display:block;width:100vw;height:100vh}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>

  <!-- Import map: mapea "three" a tu copia local -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js"
    }
  }
  </script>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu KSPLAT en la RAÍZ del repo:
const FILE = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

// Errores visibles
addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log("Cargando módulos locales…");
    // Usa tus copias locales (evita CORS/paths raros)
    const THREE = await import("./lib/three.module.js");
    const GSMOD = await import("./lib/gaussian-splats-3d.module.js");

    // Normaliza namespace (algunas builds exportan en default)
    const GS = GSMOD?.default ?? GSMOD;
    const ns = GS.GaussianSplatThreeJS ?? GS.GaussianSplatThree ?? GS;

    // ---- Localiza y usa el loader con tolerancia a variaciones ----
    let LoaderClass =
      ns?.SplatLoader || GS?.SplatLoader || GSMOD?.SplatLoader;

    // Fallbacks de métodos (instancia/estático/async)
    let loadFn = null;
    let loaderInstance = null;

    if (LoaderClass) {
      try { loaderInstance = new LoaderClass(); } catch(e){ /* puede ser clase no constructible */ }
      if (loaderInstance && typeof loaderInstance.load === 'function') {
        loadFn = (url, onProg)=> loaderInstance.load(url, onProg);
      } else if (loaderInstance && typeof loaderInstance.loadAsync === 'function') {
        loadFn = (url, onProg)=> loaderInstance.loadAsync(url, onProg);
      } else if (typeof LoaderClass.load === 'function') {
        loadFn = (url, onProg)=> LoaderClass.load(url, onProg);
      }
    }

    // Si aún no hay loader, intenta otras rutas usadas por algunas builds
    if (!loadFn) {
      const maybe = ns?.SplatLoader || ns?.loadSplat || GS?.loadSplat;
      if (typeof maybe === 'function') {
        loadFn = (url, onProg)=> maybe(url, onProg);
      }
    }

    if (!loadFn) {
      log("EXPORTS DISPONIBLES: "+Object.keys(GS).join(", "));
      throw new Error("SplatLoader no encontrado en la librería (no expone load/loadAsync).");
    }

    // Verifica que el archivo exista
    const head = await fetch(FILE, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE);

    // ---- Escena básica ----
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---- Carga KSPLAT con progreso ----
    log("Cargando KSPLAT…");
    const t0 = performance.now();
    const splat = await loadFn(FILE, (p)=>{
      if(p && p.total){
        const pct = Math.round(100*p.loaded/p.total);
        if (pct % 10 === 0) log(`Progreso: ${pct}%`);
      }
    });
    log(`Cargado en ${Math.round(performance.now()-t0)} ms`);

    // ---- Añadir y encuadre ----
    splat.frustumCulled = false;
    scene.add(splat);

    const box = new THREE.Box3().setFromObject(splat);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = Math.max(1e-6, size.length() * 0.5);
    let   dist   = radius * 1.6;

    camera.near = Math.max(0.01, radius/1000);
    camera.far  = Math.max(2000, radius*10);
    camera.updateProjectionMatrix();

    camera.position.copy(center.clone().add(new THREE.Vector3(0, 0, dist)));
    camera.lookAt(center);

    // Órbita simple + zoom con rueda
    let rotating=false, lastX=0, lastY=0, az=0, el=0;
    function setCam(){
      const x = dist*Math.cos(el)*Math.sin(az);
      const y = dist*Math.sin(el);
      const z = dist*Math.cos(el)*Math.cos(az);
      camera.position.set(center.x+x, center.y+y, center.z+z);
      camera.lookAt(center);
    }
    addEventListener('mousedown', e=>{ rotating=true; lastX=e.clientX; lastY=e.clientY; });
    addEventListener('mouseup',   ()=> rotating=false);
    addEventListener('mousemove', e=>{
      if(!rotating) return;
      const dx=(e.clientX-lastX)/innerWidth, dy=(e.clientY-lastY)/innerHeight;
      lastX=e.clientX; lastY=e.clientY;
      az += dx*Math.PI;
      el = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, el+dy*Math.PI));
      setCam();
    });
    addEventListener('wheel', e=>{
      e.preventDefault();
      const factor = (e.deltaY>0? 1.1 : 0.9);
      dist = Math.max(radius*0.3, Math.min(radius*50, dist*factor));
      setCam();
    }, {passive:false});

    // Resize
    addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Render loop
    function tick(){
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    setCam();
    tick();

    log("Listo. Arrastra para orbitar y usa la rueda para acercarte.");
  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
