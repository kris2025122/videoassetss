<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    #log{
      position:fixed;left:0;top:0;max-width:80vw;
      background:rgba(0,0,0,.65);color:#fff;padding:8px 10px;
      font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px
    }
  </style>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module">
const $log=document.getElementById('log');
const log=(m)=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu KSPLAT en la RAÍZ del repo (ya comprobaste que descarga)
const FILE_PATH = "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

// Captura errores para verlos en pantalla
window.addEventListener('error', e=> log('ERROR(win): '+e.message));
window.addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log("Cargando librería (bundle)...");
    // Importa la librería YA EMPAQUETADA (incluye dependencias) para evitar el problema de "three"
    const GS = await import("https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4.7?bundle");

    // Verifica que el archivo exista en Pages
    const head = await fetch(FILE_PATH, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE_PATH);

    // Viewer integrado compatible con GitHub Pages (sin SharedArrayBuffer)
    const viewer = new GS.Viewer({
      webXRMode: GS.WebXRMode.None,   // primero prueba en Chrome desktop
      sharedMemoryForWorkers: false,  // evita COOP/COEP
      gpuAcceleratedSort: false,      // recomendado con sharedMemoryForWorkers=false
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,
      antialiased: true,
      logLevel: GS.LogLevel.Info
    });

    await viewer.addSplatScene(FILE_PATH, {
      showLoadingUI: true
      // splatAlphaRemovalThreshold por defecto = 1 (no lo tocamos)
    });

    viewer.start();
    log("Listo: debería verse en Chrome. Luego abre esta misma URL en Quest 3.");
  }catch(err){
    log("ERROR: "+(err?.message||err));
  }
})();
</script>
</body>
</html>
