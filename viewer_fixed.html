<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (KSPLAT fijo)</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    canvas{display:block;width:100%;height:100%}
    #log{position:fixed;left:0;top:0;max-width:80vw;background:rgba(0,0,0,.65);color:#fff;
         padding:8px 10px;font:12px/1.4 monospace;white-space:pre-wrap;z-index:10;border-bottom-right-radius:8px}
  </style>
</head>
<body>
<div id="log">Inicializando…</div>
<script type="module">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Tu archivo en la RAÍZ del repo:
const FILE="TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";

(async()=>{
  try{
    log("Cargando librerías…");
    const THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
    const { VRButton } = await import('https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js');
    const { GaussianSplatThreeJS } = await import('https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d/dist/gaussian-splats-3d.module.js');

    // Comprobar que el archivo existe en Pages
    const head = await fetch(FILE, { method:'HEAD' });
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+FILE+' (¿nombre/ruta exactos?)');

    // Escena básica
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 4000);
    camera.position.set(0,0,3);

    const renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled=true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    addEventListener('resize', ()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Carga KSPLAT con progreso
    log("Cargando KSPLAT: "+FILE);
    const loader=new GaussianSplatThreeJS.SplatLoader();
    const t0=performance.now();
    const splat=await loader.load(FILE, (p)=>{
      if(p&&p.total){
        const pct=Math.round(100*p.loaded/p.total);
        if(pct%5===0) log("Progreso: "+pct+"%");
      }
    });
    log("Cargado en "+Math.round(performance.now()-t0)+" ms");

    splat.frustumCulled=false;
    scene.add(splat);

    // Órbita simple (WASD/flechas) + rueda
    let az=0, el=0, dist=3; const key={};
    addEventListener('keydown', e=> key[e.code]=true);
    addEventListener('keyup',   e=> key[e.code]=false);
    addEventListener('wheel', e=>{ dist=Math.max(0.5, Math.min(25, dist+(e.deltaY>0?0.3:-0.3))); }, {passive:true});
    const updateCam=(dt)=>{
      const spd=1.5*dt;
      if(key['ArrowLeft']||key['KeyA']) az-=spd;
      if(key['ArrowRight']||key['KeyD']) az+=spd;
      if(key['ArrowUp']||key['KeyW']) el=Math.min(Math.PI/2-0.01, el+spd);
      if(key['ArrowDown']||key['KeyS']) el=Math.max(-Math.PI/2+0.01, el-spd);
      const x=dist*Math.cos(el)*Math.sin(az), y=dist*Math.sin(el), z=dist*Math.cos(el)*Math.cos(az);
      camera.position.set(x,y,z); camera.lookAt(0,0,0);
    };

    let last=performance.now();
    renderer.setAnimationLoop(()=>{
      const now=performance.now(), dt=(now-last)/1000; last=now;
      updateCam(dt);
      renderer.render(scene,camera);
    });

    log("Listo. En Quest 3 pulsa “Enter VR”.");
  }catch(e){
    console.error(e);
    log("ERROR: "+(e?.message||e));
  }
})();
</script>
</body>
</html>
