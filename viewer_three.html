<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (Three.js + *static* Loader + VR)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{display:block;width:100vw;height:100vh}
    #log{position:fixed;left:0;top:0;max-width:80vw;background:rgba(0,0,0,.65);
         color:#fff;padding:8px 10px;font:12px/1.4 monospace;white-space:pre-wrap;z-index:9999}
  </style>

  <!-- es-module-shims para import maps -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>

  <!-- Import map -->
  <script type="importmap-shim">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module-shim">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Parámetros: ?src=…&rot=x180|y180|z180&dist=1.35&px=1.0
const q=new URLSearchParams(location.search);
const SRC  = q.get('src')  || "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";
const ROTQ = (q.get('rot') || "x180").toLowerCase();
const DIST = parseFloat(q.get('dist') || "1.35");
const PR   = parseFloat(q.get('px')   || "1.0");

const ROTATE={x:0,y:0,z:0};
if(ROTQ==="x180") ROTATE.x=Math.PI;
if(ROTQ==="y180") ROTATE.y=Math.PI;
if(ROTQ==="z180") ROTATE.z=Math.PI;

addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log('Cargando módulos…');
    const THREE = await import('three');
    const { VRButton } = await import('three/examples/jsm/webxr/VRButton.js');
    const { OrbitControls } = await import('three/examples/jsm/controls/OrbitControls.js');
    const GS = await import('@mkkellogg/gaussian-splats-3d');

    log('Loaders exportados: ' + Object.keys(GS).filter(k=>/Loader$/i.test(k)).join(', '));

    // HEAD del archivo
    const head = await fetch(SRC, {method:'HEAD'});
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+SRC);

    // ---- Three.js base ----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 5000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(PR);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ---- CARGA KSPLAT usando SOLO funciones estáticas ----
    log('Cargando KSPLAT…');

    const progressCb=(p)=>{
      if(p && p.total){
        const pct=Math.round(100*p.loaded/p.total);
        if(pct%10===0) log(`Progreso: ${pct}%`);
      }
    };

    // Intento 1: KSplatLoader.load(url, onProgress)
    let out=null;
    if(typeof GS.KSplatLoader?.load === 'function'){
      out = await GS.KSplatLoader.load(SRC, progressCb);
    }

    // Intento 2: SplatLoader.load(url, onProgress)  (algunas builds lo exponen así)
    if(!out && typeof GS.SplatLoader?.load === 'function'){
      out = await GS.SplatLoader.load(SRC, progressCb);
    }

    // Intento 3: parse desde ArrayBuffer (por si no hay .load)
    if(!out){
      log('Probando parse desde ArrayBuffer…');
      const ab = await (await fetch(SRC)).arrayBuffer();

      if(typeof GS.KSplatLoader?.parse === 'function'){
        out = GS.KSplatLoader.parse(ab);
      } else if (typeof GS.SplatLoader?.parse === 'function'){
        out = GS.SplatLoader.parse(ab);
      }
    }

    if(!out){
      log('Exports GS3D: '+Object.keys(GS).join(', '));
      throw new Error('No se pudo cargar el KSPLAT con las variantes estáticas disponibles.');
    }

    const root = out.scene || out.object || out;   // normalizar
    if(!(root && root.isObject3D)){
      throw new Error('El loader no devolvió un Object3D válido.');
    }

    // ---- Centrar + Rotar ----
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const radius = Math.max(1e-6, size.length()*0.5);

    root.position.sub(center);
    root.rotation.set(ROTATE.x, ROTATE.y, ROTATE.z);
    root.updateMatrixWorld(true);
    root.frustumCulled=false;
    scene.add(root);

    // ---- Cámara ----
    const dist = radius * DIST;
    camera.near = Math.max(0.01, radius/1000);
    camera.far  = Math.max(2000, radius*10);
    camera.updateProjectionMatrix();
    camera.position.set(0,0,dist);
    camera.lookAt(0,0,0);
    controls.target.set(0,0,0);
    controls.update();

    addEventListener('resize', ()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); });
    log('Listo. Rotado y centrado. Botón VR activo.');
  }catch(err){
    log('ERROR: '+(err?.message||err));
  }
})();
</script>
</body>
</html>
