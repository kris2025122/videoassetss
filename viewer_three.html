<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (robusto: loaders + fallback Viewer)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{display:block;width:100vw;height:100vh}
    #log{position:fixed;left:0;top:0;max-width:80vw;background:rgba(0,0,0,.65);
         color:#fff;padding:8px 10px;font:12px/1.4 monospace;white-space:pre-wrap;z-index:9999}
  </style>

  <!-- Import maps (ESM en navegadores) -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap-shim">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module-shim">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Parámetros: ?src=…&rot=x180|y180|z180&dist=1.35&px=1.0
const q=new URLSearchParams(location.search);
const SRC  = q.get('src')  || "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";
const ROTQ = (q.get('rot') || "x180").toLowerCase();
const DIST = parseFloat(q.get('dist') || "1.35");
const PR   = parseFloat(q.get('px')   || "1.0");

const ROTATE={x:0,y:0,z:0};
if(ROTQ==="x180") ROTATE.x=Math.PI;
if(ROTQ==="y180") ROTATE.y=Math.PI;
if(ROTQ==="z180") ROTATE.z=Math.PI;

addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  const THREE = await import('three');
  const { VRButton } = await import('three/examples/jsm/webxr/VRButton.js');
  const { OrbitControls } = await import('three/examples/jsm/controls/OrbitControls.js');
  const GS = await import('@mkkellogg/gaussian-splats-3d');

  log('Loaders exportados: '+Object.keys(GS).filter(k=>/Loader$/i.test(k)).join(', '));

  // Helper: centra, rota, acerca cámara
  function centerRotateAndFrame(obj, camera, controls) {
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const radius = Math.max(1e-6, size.length()*0.5);
    obj.position.sub(center);
    obj.rotation.set(ROTATE.x, ROTATE.y, ROTATE.z);
    obj.updateMatrixWorld(true);
    const dist = radius * DIST;
    camera.near = Math.max(0.01, radius/1000);
    camera.far  = Math.max(2000, radius*10);
    camera.updateProjectionMatrix();
    camera.position.set(0,0,dist);
    camera.lookAt(0,0,0);
    controls?.target.set(0,0,0);
    controls?.update?.();
  }

  // 1) Intento: cargar con loaders (variantes estáticas/con instancia y métodos comunes)
  try{
    const head = await fetch(SRC, {method:'HEAD'});
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No accesible: '+SRC);

    // Escena Three base (para ruta "loader")
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 5000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(PR);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const progressCb=(p)=>{ if(p && p.total){ const pc=Math.round(100*p.loaded/p.total); if(pc%10===0) log(`Progreso: ${pc}%`);} };

    async function tryLoad(ClassOrObj) {
      if(!ClassOrObj) return null;
      // estáticos
      for(const fn of ['loadAsync','load','loadFromUrl','fromUrl','parseAsync','parse']){
        if(typeof ClassOrObj[fn]==='function'){
          if(fn.startsWith('parse')){
            const ab = await (await fetch(SRC)).arrayBuffer();
            return await ClassOrObj[fn](ab);
          }else{
            return await ClassOrObj[fn](SRC, progressCb);
          }
        }
      }
      // instancia
      if(typeof ClassOrObj==='function'){
        const inst = new ClassOrObj();
        for(const fn of ['loadAsync','load','loadFromUrl','fromUrl','parseAsync','parse']){
          if(typeof inst[fn]==='function'){
            if(fn.startsWith('parse')){
              const ab = await (await fetch(SRC)).arrayBuffer();
              return await inst[fn](ab);
            }else{
              return await inst[fn](SRC, progressCb);
            }
          }
        }
      }
      return null;
    }

    log('Cargando KSPLAT (vía loaders)…');
    let out = null;
    out ||= await tryLoad(GS.KSplatLoader);
    out ||= await tryLoad(GS.SplatLoader);

    if(!out) throw new Error('loaders no compatibles');

    const root = out.scene || out.object || out;
    if(!(root && root.isObject3D)) throw new Error('loader no devolvió Object3D');

    root.frustumCulled=false;
    scene.add(root);
    centerRotateAndFrame(root, camera, controls);

    addEventListener('resize', ()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); });
    log('OK con loader. Botón VR activo.');
    return; // ÉXITO, no seguimos al fallback
  }catch(err){
    log('Loader falló: '+(err?.message||err));
  }

  // 2) Fallback: usar Viewer oficial (el tuyo que sí cargaba), y luego rotar/centrar
  try{
    log('Fallback Viewer…');
    const viewer = new GS.Viewer({
      webXRMode: GS.WebXRMode?.Inline ?? 1,
      sharedMemoryForWorkers: false,
      gpuAcceleratedSort: false,
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,
      antialiased: true,
      logLevel: GS.LogLevel?.Info ?? 1
    });
    viewer.renderer?.setPixelRatio?.(PR);

    const node = await viewer.addSplatScene(SRC, { format: GS.SceneFormat.KSplat, showLoadingUI: true });

    // Espera a que el objeto esté en el grafo y tómalo
    const getRoot = ()=>{
      // intenta varias rutas
      const cand = [node?.scene ?? node, viewer.scene, viewer._scene, viewer.renderer?.scene]
        .filter(Boolean);
      for(const r of cand){
        let found=null;
        r.traverse?.(o=>{ if(!found && (o.isObject3D)) found=o; });
        if(found) return found;
      }
      return null;
    };

    let root=null, t0=performance.now();
    while(!root && performance.now()-t0<8000){
      root=getRoot();
      if(!root) await new Promise(r=>setTimeout(r,100));
    }
    if(!root) throw new Error('no se pudo ubicar el Object3D en Viewer');

    // Necesitamos THREE para box/centro; lo tenemos arriba.
    centerRotateAndFrame(root, (viewer.camera||viewer._camera||viewer.renderer?.camera), (viewer.controls||viewer._controls||viewer.orbitControls||viewer._orbitControls));

    viewer.start();
    log('OK con Viewer. Botón VR activo.');
  }catch(err){
    log('ERROR fallback Viewer: '+(err?.message||err));
  }
})();
</script>
</body>
</html>
