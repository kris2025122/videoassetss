<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GS Viewer (pivot cámara + VR)</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #log{position:fixed;left:0;top:0;max-width:80vw;background:rgba(0,0,0,.65);
         color:#fff;padding:8px 10px;font:12px/1.4 monospace;white-space:pre-wrap;z-index:10}
  </style>

  <!-- Import maps -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.min.js"></script>
  <script type="importmap-shim">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>
</head>
<body>
<div id="log">Inicializando…</div>

<script type="module-shim">
const $log=document.getElementById('log');
const log=m=>{ $log.textContent+='\n'+m; console.log(m); };

// Parámetros: ?src=...&rot=x180|y180|z180&dist=1.35&px=0.9
const q = new URLSearchParams(location.search);
const SRC  = q.get('src')  || "TESTCOMPLETOPOST_keep75_k64_c2_sh2.ksplat";
const ROTQ = (q.get('rot') || "x180").toLowerCase();
const DIST = parseFloat(q.get('dist') || "1.35");
const PR   = parseFloat(q.get('px')   || "1.0");

const ROTATE={x:0,y:0,z:0};
if(ROTQ==="x180") ROTATE.x=Math.PI;
if(ROTQ==="y180") ROTATE.y=Math.PI;
if(ROTQ==="z180") ROTATE.z=Math.PI;

addEventListener('error', e=> log('ERROR(win): '+e.message));
addEventListener('unhandledrejection', e=> log('ERROR(promise): '+(e.reason?.message||e.reason)));

(async()=>{
  try{
    log('Cargando módulos…');
    const THREE = await import('three');
    const GS    = await import('@mkkellogg/gaussian-splats-3d');

    const head = await fetch(SRC, {method:'HEAD'});
    log('HEAD '+head.status+' '+(head.ok?'OK':'ERROR'));
    if(!head.ok) throw new Error('No se puede acceder a '+SRC);

    // Crear viewer
    const viewer = new GS.Viewer({
      webXRMode: GS.WebXRMode?.Inline ?? 1,   // botón VR
      sharedMemoryForWorkers: false,
      gpuAcceleratedSort: false,
      useBuiltInControls: true,
      ignoreDevicePixelRatio: true,
      antialiased: true,
      logLevel: GS.LogLevel?.Info ?? 1
    });
    viewer.renderer?.setPixelRatio?.(PR);

    // >>> Arranca primero (clave para que exponga cámara/escena)
    viewer.start();

    // Carga KSPLAT
    await viewer.addSplatScene(SRC, { format: GS.SceneFormat.KSplat, showLoadingUI: true });

    // ===== Espera robusta a cámara/escena (después de start) =====
    function getScene(v){
      return v.stage?.scene || v.stage?._scene ||
             v.scene || v._scene ||
             v.renderer?.scene || v.renderer?._scene || null;
    }
    function getCamera(v){
      return v.camera || v._camera || v.stage?.camera || v.renderer?.camera || null;
    }
    async function waitForSceneAndCamera(v, timeout=20000){
      const t0=performance.now();
      while(performance.now()-t0 < timeout){
        let scene = getScene(v);
        let cam   = getCamera(v);
        if(!cam && scene){
          scene.traverse?.(o=>{ if(!cam && o.isCamera) cam=o; });
        }
        if(scene && cam) return {scene, cam};
        await new Promise(r=>setTimeout(r,150));
      }
      return null;
    }

    log('Esperando cámara/escena…');
    const ready = await waitForSceneAndCamera(viewer);
    if(!ready) throw new Error('No se obtuvo cámara/escena (timeout).');
    const { scene, cam } = ready;

    // ===== Pivot de cámara: rotación + distancia sin tocar splats =====
    const pivot = new THREE.Object3D();
    pivot.name = 'CameraPivot';
    const parent = cam.parent || scene;
    parent.remove(cam);
    pivot.add(cam);
    scene.add(pivot);

    pivot.rotation.set(ROTATE.x, ROTATE.y, ROTATE.z);
    pivot.updateMatrixWorld(true);

    cam.position.set(0, 0, DIST);
    cam.lookAt(0,0,0);

    // Foveated (si está disponible)
    viewer.renderer?.xr?.setFoveation?.(0.7);

    log('Listo. VR activo. Rotación por pivot aplicada.');
  }catch(err){
    log('ERROR: '+(err?.message||err));
  }
})();
</script>
</body>
</html>
